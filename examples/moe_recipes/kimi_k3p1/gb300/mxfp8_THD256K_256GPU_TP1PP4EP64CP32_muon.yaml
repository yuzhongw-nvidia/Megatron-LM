# Kimi-K3.1 full text backbone: 93 decoder blocks, 256 GB300 GPUs, packed THD
# sequences of 262144 tokens (TP1, PP4, EP64, CP32; 8192 tokens per rank).
#
# Same backbone as Kimi-K3 (hidden 7168, 896-expert latent MoE top-16, MLA, KDA
# linear attention, SitU-GLU, Attention Residuals), with ONE structural change: the
# 24 full-attention layers (every 4th block + the last block) carry the DeepSeek-style
# Sparse Attention (DSA) top-k indexer instead of dense MLA. This is expressed by
# replacing the '+' (MLA) symbols of the K3 pattern with 'D' (DSA) and switching the
# global experimental_attention_variant to 'dsa'; the KDA ('K') layers are unchanged.
#
# DSA indexer follows the Kimi-K3.1 config.json: 32 index heads, head_dim 128,
# index_topk 2048, per-token (non-pooled) selection -- no KPool. Under context
# parallelism the KDA layers use the contiguous CP partition; the DSA full-attention
# layers (AbsorbedMLASelfAttention) convert their down-projected latents to the zigzag
# layout internally (minimum all-to-all volume), so a single global cp_partition_mode
# 'contiguous' drives the whole hybrid stack.
#
# Not run. The layout follows the measured 9-layer proxy: TP1 keeps all 96 attention
# heads on one rank, which the fused DSA backends need, and CP32 keeps the proxy's 8192
# tokens per rank. Whether the 93-block model fits in memory in this layout is untested.
# Head counts per backend, image and the proxy measurements: ../README.md
#
# Entry point: pretrain_hybrid.py. Launch guide: ../../kimi_k3/README.md
# Image: ../Dockerfile, built on top of the Kimi-K3 image.
DEPENDENCIES:
  pytorch_base_image: nvcr.io/nvidia/pytorch:26.04-py3
  dockerfile_path: examples/moe_recipes/kimi_k3p1/Dockerfile
ENV_VARS:
  TORCH_NCCL_AVOID_RECORD_STREAMS: '0'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_NVLS_ENABLE: '0'
  NCCL_GRAPH_REGISTER: '0'
  NCCL_DEBUG: VERSION
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: '1'
  NVTE_NORM_FWD_USE_CUDNN: '1'
  NVTE_NORM_BWD_USE_CUDNN: '1'
  PYTHONWARNINGS: ignore
  DYNAMO_CACHE_SIZE_LIMIT: '64'
  NUM_OF_TOKENS_PER_CHUNK_DISPATCH_API: '128'
  NUM_OF_TOKENS_PER_CHUNK_COMBINE_API: '128'
  NUM_OF_TOKENS_PER_CHUNK_PREPROCESSING_API: '128'
  NVTE_CPU_OFFLOAD_V1: '1'
  NCCL_LL128_BUFFSIZE: '1048576'
  NCCL_PROTO: ^LL128
  NCCL_BUFFSIZE: '2097152'
ARGS:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: moonshotai/Kimi-K3
  trust_remote_code: true
  vocab_size: 163840
  make_vocab_size_divisible_by: 1280
  spec:
  - megatron.core.models.hybrid.hybrid_layer_specs
  - hybrid_stack_spec
  enable_experimental: true
  hidden_size: 7168
  ffn_hidden_size: 33792
  num_attention_heads: 96
  # kv_channels is intentionally omitted: MLA defines its head dim via qk_head_dim /
  # qk_pos_emb_head_dim, and 7168 % 96 != 0, so the generic hidden_size // heads
  # derivation is invalid. Megatron derives kv_channels = qk_head_dim + qk_pos_emb_head_dim
  # for multi_latent_attention models (dormant in the MLA forward).
  max_position_embeddings: 1048576
  init_method_std: 0.02
  # K=KDA, D=DSA (sparse-indexer full attention), -=dense MLP, E=LatentMoE; /DE adds one
  # MTP depth. D sits at every 4th block + the last block (24 full-attn layers), matching
  # Kimi-K3.1 full_attn_layers / dsa_layers = [4, 8, ..., 92, 93]; all other blocks are KDA.
  hybrid_layer_pattern: K-KEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDE|KEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDE|KEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDE|KEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEDE/DE
  experimental_attention_variant: dsa
  linear_conv_kernel_dim: 4
  linear_key_head_dim: 128
  linear_value_head_dim: 128
  linear_num_key_heads: 96
  linear_num_value_heads: 96
  kda_f_lora_rank: 128
  kda_safe_gate: true
  kda_lower_bound: -5.0
  multi_latent_attention: true
  q_lora_rank: 1536
  kv_lora_rank: 512
  qk_head_dim: 128
  qk_pos_emb_head_dim: 64
  v_head_dim: 128
  qk_layernorm: true
  attention_latent_norm_epsilon: 1.0e-06
  attention_output_gate: true
  gated_attention_proj_granularity: elementwise
  mla_down_proj_fusion: false
  no_rope_freq: 1
  position_embedding_type: none
  # ============ DeepSeek-style Sparse Attention (DSA) indexer ============
  # Per Kimi-K3.1 config.json dsa_config: non-pooled (no KPool), LayerNorm key norm,
  # rope-less indexer (index_rope_dim 0).
  dsa_indexer_n_heads: 32
  dsa_indexer_head_dim: 128
  dsa_indexer_topk: 2048
  dsa_indexer_topk_freq: 1
  dsa_indexer_skip_topk_offset: 1
  dsa_indexer_k_norm_epsilon: 1.0e-06
  dsa_indexer_loss_coeff: 0.0
  # Kimi-K3.1's indexer has no Hadamard rotation. The option defaults to true, which
  # also needs fast_hadamard_transform; the image does not carry it.
  dsa_indexer_rotate_activation: false
  # Fused sparse-attention kernels. Both backends run the 96 heads a rank holds here
  # (../README.md); tilelang also needs TileLang added to the image.
  dsa_kernel_backend: cudnn
  enable_attention_residuals: true
  # Counts HybridModel entries (one attention or MLP sublayer per entry).
  attn_res_block_layers: 24
  normalization: RMSNorm
  norm_epsilon: 1.0e-05
  situ_glu: true
  situ_glu_beta1: 4.0
  situ_glu_beta2: 25.0
  disable_bias_linear: true
  untie_embeddings_and_output_weights: true
  num_experts: 896
  moe_ffn_hidden_size: 3072
  moe_latent_size: 3584
  moe_latent_up_projection_rmsnorm: true
  moe_shared_expert_intermediate_size: 6144
  moe_router_topk: 16
  moe_router_score_function: sigmoid
  moe_router_dtype: fp32
  moe_router_pre_softmax: false
  moe_router_topk_scaling_factor: 1.0
  moe_router_load_balancing_type: quantile_balancing
  moe_aux_loss_coeff: 0.0
  moe_router_quantile_balancing_estimation_scope: global_batch
  moe_router_qb_num_bins: 1000
  moe_router_enable_expert_bias: false
  moe_enable_routing_replay: false
  mtp_num_layers: 1
  attention_dropout: 0.0
  hidden_dropout: 0.0
  mock_data: true
  seq_length: 262144
  moe_router_force_load_balancing: true
  use_varlen_dataset: true
  varlen_mock_dataset_config_json: '{\"mode\":\"distribution\",\"type\":\"lognormal\",\"format\":\"thd\",\"min_seq_len\":262144,\"max_seq_len\":262144,\"mean_seq_len\":262144,\"lognormal_sigma\":1.1}'
  sequence_packing_scheduler: dp_balanced
  max_seqlen_per_dp_cp_rank: 8192
  pad_packed_seq_alignment: max
  calculate_per_token_loss: true
  moe_hybridep_pad_variable_tokens: false
  transformer_impl: transformer_engine
  attention_backend: flash
  distributed_timeout_minutes: 60
  tensor_model_parallel_size: 1
  sequence_parallel: false
  pipeline_model_parallel_size: 4
  expert_model_parallel_size: 64
  expert_tensor_parallel_size: 1
  # Global contiguous CP partition: native for the KDA layers; the DSA full-attention
  # layers convert their down-projected latents to zigzag internally.
  context_parallel_size: 32
  cp_partition_mode: contiguous
  linear_cp_mode: chunkwise
  # DSA all-gathers the latent KV across CP ranks.
  cp_comm_type: all_gather
  distributed_backend: nccl
  mtp_loss_scaling_factor: 0.1
  attn_res_impl: fla
  attn_res_norm_fusion: true
  attention_output_gate_fusion: true
  gdn_pre_gated_delta_rule_fusion: true
  gdn_gated_output_norm_fusion: true
  strict_runtime_validation_frequency: once_per_microbatch
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: hybridep
  moe_hybridep_num_sms: 32
  moe_grouped_gemm: true
  moe_permute_fusion: true
  moe_megakernel_backend: mok
  moe_megakernel_backend_config:
    shared_expert_mode: native
  bf16: true
  fp8_format: e4m3
  fp8_recipe: mxfp8
  fp8_param_gather: true
  reuse_grad_buf_for_mxfp8_param_ag: true
  moe_router_padding_for_quantization: true
  micro_batch_size: 1
  global_batch_size: 64
  train_iters: 50
  exit_duration_in_mins: 230
  seed: 20260901
  recompute_granularity: selective
  recompute_modules:
  - gdn
  - moe
  - mlp
  fine_grained_activation_offloading: true
  offload_modules: [core_attn, attn_proj]
  nccl_communicator_config_path: examples/moe_recipes/kimi_k3/nccl/tp_dp_cp_max_ctas16.yaml
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: native
  optimizer: muon
  use_distributed_optimizer: true
  use_precision_aware_optimizer: false
  muon_momentum: 0.95
  muon_scale_mode: spectral
  muon_extra_scale_factor: 1.0
  muon_num_ns_steps: 5
  muon_coefficient_type: quintic
  muon_split_qkv_per_head: true
  muon_tp_mode: duplicated
  muon_fp32_matmul_prec: medium
  muon_nesterov: false
  optimizer_cpu_offload: false
  optimizer_offload_fraction: 0.0
  overlap_cpu_optimizer_d2h_h2d: false
  chunked_optimizer_state_offload: true
  optimizer_state_offload_chunk_size_mb: 256
  optimizer_state_offload_fraction: 1.0
  overlap_grad_reduce: true
  overlap_param_gather: true
  no_create_attention_mask_in_dataloader: true
  lr: 1.0e-05
  min_lr: 1.0e-06
  lr_warmup_init: 1.0e-06
  lr_decay_style: cosine
  lr_decay_iters: 50
  lr_warmup_iters: 0
  weight_decay: 0.1
  clip_grad: 1.0
  no_check_for_nan_in_loss_and_grad: true
  manual_gc: true
  manual_gc_interval: 10
  eval_iters: 0
  eval_interval: 200
  no_save_optim: true
  no_load_optim: true
  no_load_rng: true
  auto_detect_ckpt_format: true
  save_interval: 500
  ckpt_format: torch_dist
  dist_ckpt_strictness: log_all
  log_throughput: true
  log_interval: 1
  logging_level: 20
  log_timers_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_validation_ppl_to_tensorboard: true
  log_memory_interval: 1
  log_device_memory_used: true
  tensorboard_dir: ${OUTPUT_PATH}/tensorboard
  wandb_exp_name: Kimi-K3p1-Full-GB300-MXFP8-THD256K-TP1-PP4EP64CP32-DSA-contigCP-FusedAttnRes-MoK-mock-GBS64
