# Kimi-K3 full text backbone: 93 decoder blocks, 256 GB300 GPUs.
# ARM64 container build passed 2026-09-17. The 2026-09-18 revision adds
# causal-conv1d after a single-node probe; see ../README.md for the status.
# Entry point: pretrain_hybrid.py. Build and launch guide: ../README.md
# Build from the repository root on an ARM64 builder:
#   yq -r '.DEPENDENCIES.dockerfile' examples/moe_recipes/kimi_k3/gb300/mxfp8_SL4K_256GPU_TP1PP4EP64_muon.yaml > Dockerfile.kimi-k3
#   docker build --platform=linux/arm64 -f Dockerfile.kimi-k3 -t megatron-kimi-k3:blackwell .
DEPENDENCIES:
  pytorch_base_image: nvcr.io/nvidia/pytorch:26.04-py3
  dockerfile: |
    # syntax=docker/dockerfile:1.7
    # Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
    # Kimi-K3 training dependencies for GB200/GB300 (ARM64).
    FROM nvcr.io/nvidia/pytorch:26.04-py3

    SHELL ["/bin/bash", "-o", "pipefail", "-c"]
    ENV DEBIAN_FRONTEND=noninteractive

    ARG TE_COMMIT=0a2ebe942b9f6a66aa0292502966e73114a7b912
    ARG CUDNN_FRONTEND_COMMIT=5ba9432e652e0b4df3aaca85cf3f95fe6bb7375a
    ARG EMERGING_OPTIMIZERS_COMMIT=a44d1f83a4950b445f2a77ca71177c5f033d45d5
    # causal-conv1d 1.6.2.post1. gdn_pre_gated_delta_rule_fusion uses its C++
    # depthwise-convolution backward; the KDA layer raises ImportError without it.
    ARG CAUSAL_CONV1D_COMMIT=4f6ae4e26ae5fe8af9372f8d312ab25cc4595223
    # Match the public DeepSeek-V4 recipe's HybridEP build. Place each EP64
    # group within one NVLink domain; this is not a cross-domain RDMA build.
    ARG HYBRID_EP_COMMIT=1b8f467965bb818bf2f6511e06993f5607e1721f
    ARG NVTE_CUDA_ARCHS="100a;103a"

    RUN apt-get update && apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates gettext libfabric-dev python3-venv && \
        rm -rf /var/lib/apt/lists/* /opt/megatron-lm

    # Inherit NGC PyTorch/CUDA while keeping pip additions separate from
    # OS-managed packages such as python3-yaml.
    RUN python -m venv --system-site-packages /opt/venv
    ENV VIRTUAL_ENV=/opt/venv
    ENV PATH="${VIRTUAL_ENV}/bin:${PATH}"

    RUN unset PIP_CONSTRAINT && python -m pip install --no-cache-dir \
            packaging ninja==1.11.1.1 cmake 'pybind11[global]>=2.13,<3' \
            sentencepiece tiktoken einops wandb tqdm datasets tensorboard \
            pydantic pyyaml omegaconf nvtx psutil flask-restful wrapt \
            tensorstore multi-storage-client opentelemetry-api \
            transformers==5.16.1 flash-linear-attention==0.5.2 \
            nvidia-resiliency-ext==0.6.0 nvidia-mathdx==25.1.1 \
            'nvidia-cutlass-dsl[cu13]==4.5.2' apache-tvm-ffi==0.1.11

    RUN unset PIP_CONSTRAINT && python -m pip install --no-cache-dir \
            --no-build-isolation \
            "nvidia-cudnn-frontend[cutedsl] @ git+https://github.com/NVIDIA/cudnn-frontend.git@${CUDNN_FRONTEND_COMMIT}"

    # These recipes use HybridEP. The optional TE NCCL EP extension uses
    # a NCCL device API that does not match the NGC 26.04 base.
    RUN unset PIP_CONSTRAINT && \
        NVTE_CUDA_ARCHS="${NVTE_CUDA_ARCHS}" NVTE_BUILD_THREADS_PER_JOB=8 \
        NVTE_FRAMEWORK=pytorch NVTE_WITH_NCCL_EP=0 \
        python -m pip install --no-build-isolation --no-cache-dir \
            "git+https://github.com/NVIDIA/TransformerEngine.git@${TE_COMMIT}"

    # Muon with per-head QKV splitting. Pin the source revision rather than
    # the older release used by some published container tags.
    RUN unset PIP_CONSTRAINT && python -m pip install --no-cache-dir \
            --no-build-isolation \
            "git+https://github.com/NVIDIA-NeMo/Emerging-Optimizers.git@${EMERGING_OPTIMIZERS_COMMIT}"

    # No prebuilt causal-conv1d wheel matches this base, so build from source.
    # nvcc 13 adds the sm_100 and sm_103 cubins to the default architecture list.
    RUN unset PIP_CONSTRAINT && \
        CAUSAL_CONV1D_FORCE_BUILD=TRUE \
        python -m pip install --no-build-isolation --no-cache-dir \
            "git+https://github.com/Dao-AILab/causal-conv1d.git@${CAUSAL_CONV1D_COMMIT}"

    RUN git clone --branch hybrid-ep https://github.com/deepseek-ai/DeepEP.git /opt/DeepEP && \
        cd /opt/DeepEP && git checkout "${HYBRID_EP_COMMIT}" && \
        unset PIP_CONSTRAINT && \
        HYBRID_EP_MULTINODE=0 TORCH_CUDA_ARCH_LIST="10.0" \
        python -m pip install --no-build-isolation --no-cache-dir .

    # NGC's triton-kernels declares pytest as a dependency.
    # Preserve dependency consistency as a build requirement.
    RUN unset PIP_CONSTRAINT && python -m pip install --no-cache-dir pytest && \
        python -m pip check && rm -rf /root/.cache/pip
    WORKDIR /workspace/Megatron-LM
ENV_VARS:
  TORCH_NCCL_AVOID_RECORD_STREAMS: '0'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_NVLS_ENABLE: '0'
  NCCL_GRAPH_REGISTER: '0'
  NCCL_DEBUG: VERSION
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: '1'
  NVTE_NORM_FWD_USE_CUDNN: '1'
  NVTE_NORM_BWD_USE_CUDNN: '1'
  PYTHONWARNINGS: ignore
  # AttnRes compilation specializes on the number of depth sources.
  DYNAMO_CACHE_SIZE_LIMIT: '64'
ARGS:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: moonshotai/Kimi-K3
  trust_remote_code: true
  vocab_size: 163840
  make_vocab_size_divisible_by: 1280
  spec:
  - megatron.core.models.hybrid.hybrid_layer_specs
  - hybrid_stack_spec
  enable_experimental: true
  hidden_size: 7168
  ffn_hidden_size: 33792
  num_attention_heads: 96
  kv_channels: 64
  max_position_embeddings: 1048576
  init_method_std: 0.02
  # K=KDA, +=MLA, -=dense MLP, E=LatentMoE; /+E adds one MTP depth.
  hybrid_layer_pattern: K-KEKE+EKEKEKE+EKEKEKE+EKEKEKE+EKEKEKE+EKEKEKE+E|KEKEKE+EKEKEKE+EKEKEKE+EKEKEKE+EKEKEKE+EKEKEKE+E|KEKEKE+EKEKEKE+EKEKEKE+EKEKEKE+EKEKEKE+EKEKEKE+E|KEKEKE+EKEKEKE+EKEKEKE+EKEKEKE+EKEKEKE+E+E/+E
  experimental_attention_variant: kda
  linear_conv_kernel_dim: 4
  linear_key_head_dim: 128
  linear_value_head_dim: 128
  linear_num_key_heads: 96
  linear_num_value_heads: 96
  kda_f_lora_rank: 128
  kda_safe_gate: true
  kda_lower_bound: -5.0
  multi_latent_attention: true
  q_lora_rank: 1536
  kv_lora_rank: 512
  qk_head_dim: 128
  qk_pos_emb_head_dim: 64
  v_head_dim: 128
  qk_layernorm: true
  attention_latent_norm_epsilon: 1.0e-06
  attention_output_gate: true
  gated_attention_proj_granularity: elementwise
  mla_down_proj_fusion: false
  no_rope_freq: 1
  position_embedding_type: none
  enable_attention_residuals: true
  # Counts HybridModel entries (one attention or MLP sublayer per entry).
  attn_res_block_layers: 24
  normalization: RMSNorm
  norm_epsilon: 1.0e-05
  situ_glu: true
  situ_glu_beta1: 4.0
  situ_glu_beta2: 25.0
  disable_bias_linear: true
  untie_embeddings_and_output_weights: true
  num_experts: 896
  moe_ffn_hidden_size: 3072
  moe_latent_size: 3584
  moe_latent_up_projection_rmsnorm: true
  moe_shared_expert_intermediate_size: 6144
  moe_router_topk: 16
  moe_router_score_function: sigmoid
  moe_router_dtype: fp32
  moe_router_pre_softmax: false
  moe_router_topk_scaling_factor: 1.0
  moe_router_load_balancing_type: quantile_balancing
  moe_aux_loss_coeff: 0.0
  moe_router_quantile_balancing_estimation_scope: global_batch
  moe_router_qb_num_bins: 1000
  moe_router_enable_expert_bias: false
  moe_enable_routing_replay: false
  mtp_num_layers: 1
  attention_dropout: 0.0
  hidden_dropout: 0.0
  mock_data: true
  seq_length: 4096
  moe_router_force_load_balancing: true
  transformer_impl: transformer_engine
  attention_backend: fused
  distributed_timeout_minutes: 60
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 4
  expert_model_parallel_size: 64
  expert_tensor_parallel_size: 1
  context_parallel_size: 1
  distributed_backend: nccl
  mtp_loss_scaling_factor: 0.1
  attn_res_impl: compile
  gdn_pre_gated_delta_rule_fusion: true
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: hybridep
  moe_hybridep_num_sms: 32
  moe_grouped_gemm: true
  moe_permute_fusion: true
  bf16: true
  fp8_format: e4m3
  fp8_recipe: mxfp8
  fp8_param_gather: true
  reuse_grad_buf_for_mxfp8_param_ag: true
  moe_router_padding_for_quantization: true
  micro_batch_size: 1
  global_batch_size: 4096
  train_iters: 50
  exit_duration_in_mins: 220
  seed: 20260901
  recompute_granularity: selective
  # Recompute KDA, MoE/MLP and MLA up-projection activations.
  recompute_modules:
  - gdn
  - moe
  - mlp
  - mla_up_proj
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: native
  optimizer: muon
  use_distributed_optimizer: true
  use_precision_aware_optimizer: false
  muon_momentum: 0.95
  muon_scale_mode: spectral
  muon_extra_scale_factor: 1.0
  muon_num_ns_steps: 5
  muon_coefficient_type: quintic
  muon_split_qkv_per_head: true
  muon_tp_mode: duplicated
  muon_fp32_matmul_prec: medium
  muon_nesterov: false
  optimizer_cpu_offload: false
  optimizer_offload_fraction: 0.0
  overlap_cpu_optimizer_d2h_h2d: false
  # Run optimizer computation on GPU; offload states in bounded chunks.
  chunked_optimizer_state_offload: true
  optimizer_state_offload_chunk_size_mb: 256
  optimizer_state_offload_fraction: 1.0
  overlap_grad_reduce: true
  overlap_param_gather: true
  no_create_attention_mask_in_dataloader: true
  # Short benchmark schedule inherited from the reference recipe.
  lr: 1.0e-05
  min_lr: 1.0e-06
  lr_warmup_init: 1.0e-06
  lr_decay_style: cosine
  lr_decay_iters: 50
  lr_warmup_iters: 0
  weight_decay: 0.1
  clip_grad: 1.0
  no_check_for_nan_in_loss_and_grad: true
  manual_gc: true
  manual_gc_interval: 10
  eval_iters: 0
  eval_interval: 200
  no_save_optim: true
  no_load_optim: true
  no_load_rng: true
  auto_detect_ckpt_format: true
  save_interval: 500
  ckpt_format: torch_dist
  dist_ckpt_strictness: log_all
  log_throughput: true
  log_interval: 1
  logging_level: 20
  log_timers_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_validation_ppl_to_tensorboard: true
  log_memory_interval: 1
  log_device_memory_used: true
  tensorboard_dir: ${OUTPUT_PATH}/tensorboard
  wandb_exp_name: Kimi-K3-Full-GB300-MXFP8-PerHeadMuon-PreGDRFusion-MTP1-AttnResCompile-ChunkedOptStateOffload-TP1PP4EP64CP1-SL4096
